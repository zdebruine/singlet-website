# These functions accept anonymous callers (the catalog API forwards the
# visitor's session token or API key when there is one) and validate user
# tokens themselves, so the platform-level JWT gate stays off.
[functions.interpret-search-query]
verify_jwt = false

[functions.explain-results]
verify_jwt = false

# Validates the user's session itself (api keys are never JWTs).
[functions.api-keys]
verify_jwt = false

[functions.product-data]
verify_jwt = false

# GitHub sign-in runs its own OAuth exchange (anonymous callers by design).
[functions.github-oauth]
verify_jwt = false
