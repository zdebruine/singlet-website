version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      radix-and-shadcn: { patterns: ["@radix-ui/*"] }
      tooling: { patterns: ["eslint*", "typescript*", "vite*", "vitest*", "@vitejs/*"] }
