name: CI

# Every PR and every push to main runs the same build Cloudflare Pages runs
# (prebuild = vitest + functions typecheck + functions bundle, then vite build).
# Cloudflare reports the static deploy as green even when Functions fail to
# compile, so this is the gate that catches it.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "public/data/hpc/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check (vitest + functions typecheck + functions bundle)
        run: npm run check
      - name: Build
        run: npm run build
      - name: Typecheck app (advisory)
        run: npx tsc -p tsconfig.app.json --noEmit
        continue-on-error: true
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
