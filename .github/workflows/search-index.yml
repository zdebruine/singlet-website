name: Search index

# Nightly rebuild of the cohort bit index (docs/COHORT-QUERY.md section 1) from production D1 and upload to the
# data bucket (singlet-data, search-index/v1/). /api/cohort/resolve and /api/cohort/manifest read it through
# data.singlet.bio and pick up a new version within about five minutes. scripts/search-index/publish.sh does the work:
# export gsm + sample_qc + bundle_index layers, export sample_attr, build, upload the binary, then index.json.
# Runs after the 3-hourly catalog crank, so the night's QC and usable flags are in. Read-only on D1.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (D1 read, R2 write) and CLOUDFLARE_ACCOUNT_ID.

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

concurrency:
  group: search-index
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and publish the index
        run: scripts/search-index/publish.sh
      - name: The published index answers
        run: |
          sleep 20
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -m 60 -o body.json -w '%{http_code}' "https://singlet.bio/api/cohort/resolve?organism=Homo%20sapiens&facets=0&what_if=0")
            [ "$code" = 200 ] && break
            sleep 20
          done
          echo "resolve: HTTP $code"
          [ "$code" = 200 ] && jq -c '{index, totals}' body.json
          [ "$code" = 200 ]
