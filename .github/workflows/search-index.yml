name: Search index

# Nightly rebuild of the cohort bit index (docs/COHORT-QUERY.md section 1), published to the data bucket
# (singlet-data, search-index/v1/). /api/cohort/resolve and /api/cohort/manifest read it through data.singlet.bio and
# pick up a new version within about five minutes. scripts/search-index/publish.sh does the work through the site's
# ingest API only: it pages GET /api/ingest/export (samples, studies, sample_attr), builds, then POSTs the binary and
# index.json to /api/ingest/search-index. Runs after the 3-hourly catalog crank, so the night's QC and usable flags are in.
# Needs the repository secret SINGLET_INGEST_TOKEN; no Cloudflare credentials.

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

concurrency:
  group: search-index
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SINGLET_INGEST_TOKEN: ${{ secrets.SINGLET_INGEST_TOKEN }}
      SITE_URL: https://singlet.bio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and publish the index
        run: scripts/search-index/publish.sh
      - name: The published index answers
        run: |
          sleep 20
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -m 60 -o body.json -w '%{http_code}' "$SITE_URL/api/cohort/resolve?organism=Homo%20sapiens&facets=0&what_if=0")
            [ "$code" = 200 ] && break
            sleep 20
          done
          echo "resolve: HTTP $code"
          [ "$code" = 200 ] && jq -c '{index, totals}' body.json
          [ "$code" = 200 ]
