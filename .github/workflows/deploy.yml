name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # `pages deploy` requires the project to exist. Try to create it; if it
      # already exists (or the token lacks create perms — see deploy step), we
      # continue regardless and let the deploy step surface any real error.
      - name: Ensure Pages project exists
        id: ensure_project
        continue-on-error: true
        run: |
          npx --yes wrangler@3 pages project create singlet-website \
            --production-branch=main 2>&1 | tee /tmp/create.log || true
          if grep -qiE "already exists|conflict" /tmp/create.log; then
            echo "Project already exists — fine."
          fi

      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@3 pages deploy ./dist \
            --project-name=singlet-website \
            --branch=main
