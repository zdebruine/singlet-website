# Cloudflare Pages project name (matches the CF Pages project "singlet").
name = "singlet"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# ── D1 Database ───────────────────────────────────────────────────────────────
# Binding name "DB" is consumed by functions/api/*.ts as `env.DB`.
# database_id is the real production D1 UUID (non-secret).
[[d1_databases]]
binding = "DB"
database_name = "singlet-catalog"
database_id = "fb42f359-92a0-452c-91e4-f630f627c4c7"

# ── R2 Bucket ─────────────────────────────────────────────────────────────────
# Binding name "SINGLET_DATA"; bucket served publicly at https://data.singlet.bio
[[r2_buckets]]
binding = "SINGLET_DATA"
bucket_name = "singlet-data"

# Private, account-owned .singlet files. Objects are never publicly exposed;
# Pages Functions authorize every read and issue one-hour signed loader URLs.
[[r2_buckets]]
binding = "USER_DATA"
bucket_name = "singlet-user-data"

# HPC dashboard snapshots (/hpc page). The cluster orchestrators upload JSON
# with POST /api/ingest/hpc?path=… and the page reads GET /api/hpc/<path>;
# see functions/api/ingest/hpc.ts.
[[r2_buckets]]
binding = "HPC_DASHBOARD"
bucket_name = "singlet-hpc-dashboard"

# ── Environment variables (non-secret) ───────────────────────────────────────
# NOTE: VITE_R2_PUBLIC_URL is a Vite *build-time* var (baked into the static
# bundle), NOT a Worker runtime var, so it does NOT belong here. Its committed
# default ("https://data.singlet.bio") is set in vite.config.ts and also has a
# fallback in src/components/DownloadPanel.tsx. To override at deploy time, set
# VITE_R2_PUBLIC_URL as a Cloudflare Pages *build* environment variable.
[vars]
ENVIRONMENT = "production"

# Public client id of the GitHub OAuth app (not secret). The matching
# GITHUB_CLIENT_SECRET — and GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET — are set
# as encrypted secrets in the dashboard (Settings → Variables and Secrets).
GITHUB_CLIENT_ID = "Ov23liHa1tQnWNBZjrSZ"

# AI search: query interpretation and result explanations. Workers AI model ids
# start with "@cf/"; a third-party id such as "anthropic/claude-haiku-4-5"
# routes through AI Gateway unified billing (needs gateway credits, no key).
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# AI Gateway id for logs, caching and rate limits ("default" is auto-created).
AI_GATEWAY_ID = "default"

# ── Workers AI ────────────────────────────────────────────────────────────────
# Binding "AI" is consumed by functions/_shared/ai.ts as `env.AI`. No API key:
# usage is billed to this Cloudflare account.
[ai]
binding = "AI"
