# Beta channel (beta.singlet.bio): the same code and the same build as singlet.bio, bound to Beta's own resources.
# Cloudflare Pages project `singlet-beta` (production branch `beta`). Deploy: `npm run beta:deploy` (docs/BETA-CHANNEL.md).
# Differences from wrangler.toml are configuration only: D1, R2 buckets, CHANNEL, S1_ORIGIN. Resource ids are recorded in docs/BETA-CHANNEL.md.
name = "singlet-beta"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "singlet-beta-catalog"
database_id = "75e54649-de1c-47c6-a242-718e2885748f"

# Public per-sample objects (s1/…), written by /api/ingest/s1-object and s1-publish, read by the data Worker beta-data.singlet.bio.
[[r2_buckets]]
binding = "SINGLET_DATA"
bucket_name = "singlet-beta-data"

# Beta's dashboard snapshots, including the daily product-test report (beta/product-test.json, served at /api/hpc/beta/product-test.json).
[[r2_buckets]]
binding = "HPC_DASHBOARD"
bucket_name = "singlet-beta-dashboard"

# No USER_DATA: account uploads are not part of Beta.

[vars]
ENVIRONMENT = "beta"
CHANNEL = "beta"
# Origin of the Beta data Worker (workers/data/wrangler.beta.toml). Clients use the same value as SINGLET_DATA_BASE.
S1_ORIGIN = "https://beta-data.singlet.bio"
AI_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
AI_GATEWAY_ID = "default"

[ai]
binding = "AI"
